name: Go Setup
description: Install Go
inputs:
  cache:
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: setup-go
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
        cache: ${{ inputs.cache }}
    - name: Download modules
      shell: bash
      run: go mod download
